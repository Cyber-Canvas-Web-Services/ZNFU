<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ZNFU — Zambia National Farmers' Union</title>
    <meta
      name="description"
      content="Founded in 1905, the Zambia National Farmers' Union is a non-political, member-led union representing small-scale and commercial farmers, commodity associations and agribusinesses across Zambia."
    />
    <meta name="theme-color" content="#0a1e13" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZNFU — Zambia National Farmers' Union" />
    <meta
      property="og:description"
      content="A united voice for Zambian agriculture since 1905."
    />
    <!-- Social card is a JPEG on purpose: several link scrapers cannot read
         WebP. Produced by scripts/optimize-media.sh. -->
    <meta property="og:image" content="/media/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The hero poster is the first thing the page paints, and it is rendered
         by Vue — so without this the browser would not discover it until the
         bundle had parsed and executed. Preloading it starts the fetch at HTML
         parse time instead. Same file for every breakpoint. -->
    <link
      rel="preload"
      as="image"
      href="/media/hero-background-poster.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
